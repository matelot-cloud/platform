name: SecOps platform
description: Report releases and deployments or run security pipelines with a signed CI token.
inputs:
  url: { description: Platform URL (https://acme.secops.example.com), required: true }
  key-id: { description: CI token key id (sk_…), required: true }
  secret: { description: CI token secret (sec_…) — store it as a GitHub secret, required: true }
  command: { description: "deploy | release | pipeline | whoami", required: true }
  args: { description: "Arguments, e.g. --env <environmentId> --version ${{ github.ref_name }}", required: false, default: "" }
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SECOPS_URL: ${{ inputs.url }}
        SECOPS_KEY_ID: ${{ inputs.key-id }}
        SECOPS_SECRET: ${{ inputs.secret }}
      run: bash "${{ github.action_path }}/secops.sh" ${{ inputs.command }} ${{ inputs.args }}
