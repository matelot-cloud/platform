# One release of this chart == one client. Namespace convention: tenant-<slug>.

tenant:
  slug: acme                 # DNS label; also the root organization slug
  name: "ACME Corp"          # root organization display name
  domain: platform.local     # app+api: <slug>.<domain>   auth: auth-<slug>.<domain>   registry: registry-<slug>.<domain>
  adminEmails:               # first login of these users receives ORG_ADMIN on the root org
    - admin@acme.local

image:
  repository: ghcr.io/matelot-cloud/api
  tag: ""                    # defaults to Chart.appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Background worker (ghcr.io/matelot-cloud/worker: the API image with the worker entrypoint)
worker:
  image:
    repository: ghcr.io/matelot-cloud/worker
    tag: ""                  # defaults to Chart.appVersion
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Managed runners: the cell's own runner agents (StatefulSet). They register into the "Managed" pool with a secret
# shared with the API (generated on first install and kept across upgrades, like the encryption key) and run pipeline
# jobs of every organization of the cell, so a fresh cell needs no customer-installed runner. Jobs that must reach the
# customer's network keep using self-hosted pools. replicas: 0 stops them; enabled: false removes them and the secret.
managedRunners:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/matelot-cloud/runner
    tag: ""                  # defaults to Chart.appVersion
    pullPolicy: IfNotPresent
  tags: []                   # extra tags (the pool adds "managed"; the agent adds linux)
  secret: ""                 # leave empty to generate (min 32 characters when set)
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }
  workDirSize: 4Gi           # emptyDir for checkouts and image layers

# Encryption key for integration credentials at rest (64 hex chars). Leave empty to let the chart
# generate one on first install and keep it across upgrades (the Secret is reused, never rotated).
encryptionKey: ""

# Built-in container registry (Docker Distribution; auth delegated to the API).
registry:
  enabled: true
  image: registry:2.8.3
  host: ""            # default registry-<slug>.<domain>; set to override (e.g. registry.acme.example.com)
  storage: 50Gi
  storageClass: ""
  # Signing key + certificate (PEM) for registry tokens; leave both empty to generate on first install (kept across upgrades).
  tokenKey: ""
  tokenCert: ""
  eventsSecret: ""    # generated when empty
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

# GitHub App for this cell. Leave appId empty to keep GitHub unavailable.
github:
  appId: ""
  slug: ""
  privateKeyBase64: ""
  webhookSecret: ""
  apiUrl: https://api.github.com
  url: https://github.com

api:
  replicas: 1
  logLevel: info
  corsOrigins: []            # e.g. ["https://acme.platform.example.com"]
  extraEnv: {}               # plain KEY: value pairs added to the ConfigMap
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

web:
  enabled: true
  productName: ""            # defaults to "<tenant.name> Security Platform"
  docsUrl: https://matelot-cloud.github.io/website/docs/latest/   # the public documentation site opened by the sidebar's "Documentation" (a mirror of it for air-gapped cells)
  image:
    repository: ghcr.io/matelot-cloud/web
    tag: ""                  # defaults to Chart.appVersion
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }

ingress:
  enabled: true
  className: nginx
  controllerNamespace: ingress-nginx   # used by the NetworkPolicy
  tls: false                           # true => https hosts + TLS secrets (cert-manager annotation below)
  annotations: {}
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt

postgres:
  bundled: true              # in-namespace StatefulSet. Production: bundled=false + managed/operator DB.
  image: postgres:16
  storage: 5Gi
  storageClassName: ""       # "" = cluster default
  database: platform
  username: platform
  password: change-me-please
  keycloakDatabase: keycloak
  externalUrl: ""            # postgresql://user:pass@host:5432/platform   (bundled=false)
  externalKeycloakJdbcUrl: "" # jdbc:postgresql://host:5432/keycloak          (bundled=false)
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

redis:
  bundled: true
  image: redis:7-alpine
  externalUrl: ""            # redis://host:6379 (bundled=false)
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

keycloak:
  bundled: true
  image: quay.io/keycloak/keycloak:26.0
  realm: platform
  audience: platform-api
  adminUser: admin
  adminPassword: change-me-please
  allowPasswordGrant: true   # direct-access grants on platform-web; handy for CLI/dev, disable in prod
  extraRedirectUris: ["http://localhost:5173/*"]
  seedUsers:                 # dev convenience; leave empty in production (users come via SSO / SCIM)
    - username: admin
      email: admin@acme.local
      firstName: Cell
      lastName: Admin
      password: admin
  externalUrl: ""            # https://auth.example.com                                   (bundled=false)
  externalIssuer: ""         # override; defaults to <externalUrl>/realms/<realm>
  externalJwksUri: ""        # override; defaults to <issuer>/protocol/openid-connect/certs
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { cpu: "2", memory: 1536Mi }

backup:
  # Scheduled backup of the cell: pg_dump of the platform and Keycloak databases plus the cell's Secrets (encryption
  # key, managed-runner secret, registry keys, database and Keycloak credentials), one tar.gz per run.
  # Restore with scripts/cell-restore.sh (matelot-cloud/helm-charts) — see the Backup and restore guide. The registry's image blobs are NOT included.
  enabled: false
  schedule: "17 2 * * *"       # cron, UTC
  retentionDays: 14            # prune archives older than this on the PVC (0 = keep everything)
  image: ""                    # defaults to postgres.image, so pg_dump matches the server
  pvc:                         # keep archives in the namespace (a helper pod reads them back: scripts/cell-backup.sh -d DIR)
    enabled: true
    size: 10Gi
    storageClassName: ""
  s3:                          # and/or copy each archive off-site to an S3(-compatible) bucket
    enabled: false
    bucket: ""
    prefix: ""                 # e.g. cells/acme (no leading slash)
    endpoint: ""               # S3-compatible endpoint URL (MinIO, Ceph, …); empty = AWS
    region: ""
    credentialsSecret: ""      # Secret with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY; empty = pod identity (IRSA / workload identity)
    image: amazon/aws-cli:2.22.35
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 1Gi }
networkPolicy:
  enabled: true
