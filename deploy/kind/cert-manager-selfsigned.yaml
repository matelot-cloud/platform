# Local CA for kind (scripts/kind-up.sh): a self-signed bootstrap issuer signs one CA certificate, and the ClusterIssuer
# "selfsigned" issues every cell's certificates from that CA — one certificate to trust in the browser, HTTPS everywhere.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: matelot-dev-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Matelot dev CA (kind)
  secretName: matelot-dev-ca
  duration: 87600h   # 10 years
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: selfsigned-bootstrap, kind: ClusterIssuer, group: cert-manager.io }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  ca:
    secretName: matelot-dev-ca
