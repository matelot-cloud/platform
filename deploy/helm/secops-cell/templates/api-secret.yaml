apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-api-secrets
  labels:
    {{- include "cell.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "cell.databaseUrl" . | quote }}
  REDIS_URL: {{ include "cell.redisUrl" . | quote }}
  GITHUB_APP_PRIVATE_KEY_BASE64: {{ .Values.github.privateKeyBase64 | quote }}
  GITHUB_APP_WEBHOOK_SECRET: {{ .Values.github.webhookSecret | quote }}
  # the backup job reports each run to POST /api/v1/internal/backup-reports with it (matelot_backup_* metrics)
  BACKUP_REPORT_TOKEN: {{ include "cell.backupReportToken" . | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-cell-key
  labels:
    {{- include "cell.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  CELL_ENCRYPTION_KEY: {{ include "cell.encryptionKey" . | quote }}
