# Matelot configuration for a project — applied with: matelot apply -f matelot-config.yaml --scope projects/<id>
channels:
  - name: "#security-alerts"
    kind: slack
    url: ${SLACK_WEBHOOK}
    events: [gate.fail, deployment.rejected, kev.production, secret.detected]
  - name: ops-hook
    kind: webhook
    url: ${OPS_WEBHOOK}
    events: [deployment.production, sla.overdue]
policies:
  - name: CRA baseline
    template: cra-baseline
  - name: Dev advisory
    template: dev-advisory
    enabled: true
sla:
  critical: 5
  high: 20
  jiraProjectKey: SEC
