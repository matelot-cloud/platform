# Cell: Globex Corporation (globex) — one file per cell, committed; secrets stay out (the ${VAR} placeholders are filled from
# the environment by scripts/cell-provision.sh at apply time). Anything not set here keeps the chart default.
tenant:
  slug: globex
  name: "Globex Corporation"
  domain: platform.local            # app: globex.platform.local  auth: auth-globex.platform.local  registry: registry-globex.platform.local
  adminEmails: ["ciso@globex.test"]       # first login of these e-mails receives ORG_ADMIN on the root organization

image:
  repository: ghcr.io/matelot-cloud/api
  tag: "0.1.0-rc.21"                  # all four images move together: scripts/cell-provision.sh apply --tag X
worker:
  image: { repository: ghcr.io/matelot-cloud/worker, tag: "0.1.0-rc.21" }
web:
  image: { repository: ghcr.io/matelot-cloud/web, tag: "0.1.0-rc.21" }
managedRunners:
  image: { repository: ghcr.io/matelot-cloud/runner, tag: "0.1.0-rc.21" }
  replicas: 1
imagePullSecrets: []            # e.g. [{ name: ghcr-pull }] — create the Secret in tenant-globex first

api:
  replicas: 1
  corsOrigins: ["https://globex.platform.local"]
  extraEnv: {}                  # SMTP_HOST, SMTP_PORT, SMTP_FROM, … for e-mail notifications (secrets via ${VAR})

ingress:
  className: nginx
  tls: true                     # mandatory for any hostname but localhost: browsers sign in only in a secure context (HTTPS)
  annotations:
    cert-manager.io/cluster-issuer: selfsigned   # letsencrypt in production; selfsigned on kind (scripts/kind-up.sh)

postgres:
  bundled: true                 # production: bundled: false + externalUrl / externalKeycloakJdbcUrl (managed database)
  storage: 20Gi
  password: ${DB_PASSWORD}
redis:
  bundled: true
keycloak:
  bundled: true
  adminPassword: ${KC_ADMIN_PASSWORD}
  allowPasswordGrant: false
  seedUsers: []                 # users come from the customer's IdP (docs/cell-provisioning.md §Handover)

backup:
  enabled: true
  schedule: "17 2 * * *"
  retentionDays: 7
  pvc: { enabled: true, size: 20Gi }
  s3:
    enabled: false              # recommended: enabled, bucket, prefix: cells/globex, region, credentialsSecret or pod identity
    bucket: ""
    prefix: cells/globex

observability:
  metrics:
    serviceMonitor:
      enabled: true   # needs the prometheus-operator CRDs (kube-prometheus-stack)
      labels:
        release: "kube-prometheus-stack"
    exporters:
      enabled: true   # postgres_exporter / redis_exporter sidecars, Keycloak and registry metrics
  prometheusRules:
    enabled: true   # the alert rules as a PrometheusRule (the same labels select it)
    labels:
      release: "kube-prometheus-stack"
  grafana:
    dashboards:
      enabled: true   # the four dashboards as ConfigMaps for Grafana's sidecar
  otlp:
    endpoint: "http://tempo.monitoring:4318"   # OTLP traces (docs/observability.md); empty = tracing off
    protocol: http/protobuf
