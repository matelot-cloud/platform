apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "cell.labels" . | nindent 4 }}
    app.kubernetes.io/name: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        {{- include "cell.podLabels" . | nindent 8 }}
        app.kubernetes.io/name: api
        secops.io/ingress-exposed: "true"
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/api-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/api-secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}-api
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Applies pending SQL migrations. Safe to run from every replica (advisory-locked);
        # retries internally while Postgres is still starting.
        - name: migrate
          image: {{ include "cell.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/migrate.js"]
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-api-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: {{ include "cell.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
            {{- if .Values.observability.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.observability.metrics.port }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-api-config
            {{- if .Values.observability.otlp.headers }}
            - secretRef:
                name: {{ .Release.Name }}-otel
            {{- end }}
            - secretRef:
                name: {{ .Release.Name }}-api-secrets
            - secretRef:
                name: {{ .Release.Name }}-cell-key
            {{- if .Values.managedRunners.enabled }}
            - secretRef:
                name: {{ .Release.Name }}-managed-runner
            {{- end }}
            {{- if .Values.registry.enabled }}
            - secretRef:
                name: {{ .Release.Name }}-registry
            {{- end }}
          env:
            - name: MATELOT_COMPONENT
              value: api
          {{- if .Values.keycloak.bundled }}
            # user administration (create, reset, invite links) through the bundled Keycloak's admin API
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-keycloak, key: KC_BOOTSTRAP_ADMIN_USERNAME } }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-keycloak, key: KC_BOOTSTRAP_ADMIN_PASSWORD } }
          {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.registry.enabled }}
            - name: registry-key
              mountPath: /etc/secops/registry
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.registry.enabled }}
        - name: registry-key
          secret:
            secretName: {{ .Release.Name }}-registry
            items: [{ key: registry.key, path: registry.key }]
        {{- end }}
