# kube-prometheus-stack 92.11.0 for Matelot (docs/observability.md, "kube-prometheus-stack"): kind as written; a real
# cluster keeps everything here and adds persistence / retention / ingress for Grafana (see the doc).
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack --version 92.11.0 \
#     -n monitoring --create-namespace -f deploy/observability/kind/kube-prometheus-stack.values.yaml
# The release name matters: with serviceMonitorSelectorNilUsesHelmValues / ruleSelectorNilUsesHelmValues (defaults) the
# Prometheus selects ServiceMonitors and PrometheusRules labelled release=<release name> — the label the cell's objects
# get from observability.metrics.serviceMonitor.labels and observability.prometheusRules.labels. Grafana's sidecar
# loads every ConfigMap labelled grafana_dashboard=1 (the cell's four dashboards).
prometheus:
  prometheusSpec:
    enableFeatures: [exemplar-storage]        # exemplars on the pipeline / job / HTTP histograms → Tempo
    serviceMonitorNamespaceSelector: {}       # every namespace (the cells live in tenant-<slug>)
    ruleNamespaceSelector: {}                 # the cells' PrometheusRules too (observability.prometheusRules, label release=<this release>)
    retention: 2d
    resources: { requests: { cpu: 100m, memory: 512Mi } }
# a minimal Alertmanager: without one, kube-prometheus-stack's own PrometheusNotConnectedToAlertmanagers fires forever,
# and this way the cell's alerts are visible routed (http://localhost:9093 → port-forward, see kind-observability.sh).
# Nothing is sent anywhere: every route ends in a receiver without integrations. A real cluster puts its pager /
# Slack / e-mail receivers on the `matelot` route.
alertmanager:
  enabled: true
  alertmanagerSpec:
    retention: 24h
    resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
  config:
    global: { resolve_timeout: 5m }
    route:
      receiver: "null"
      group_by: [alertname, cell, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - matchers: ['alertname = "Watchdog"']        # the stack's always-firing heartbeat
          receiver: "null"
        - matchers: ['alertname =~ "Matelot.+"']       # the cell's rules (observability.prometheusRules)
          receiver: matelot
    inhibit_rules:
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity = "warning"']
        equal: [alertname, cell]
    receivers:
      - name: "null"
      - name: matelot                                  # add slack_configs / email_configs / webhook_configs here
grafana:
  adminPassword: matelot-kind                 # kind only — a real cluster sets admin.existingSecret
  env:
    GF_PLUGINS_PREINSTALL_DISABLED: "true"    # no plugin downloads at every start (air-gapped clusters; the dashboards need none)
  sidecar:
    dashboards:
      folderAnnotation: grafana_folder       # the cells' dashboard ConfigMaps say which folder (observability.grafana.dashboards.folder)
      provider: { foldersFromFilesStructure: true }
    datasources:
      exemplarTraceIdDestinations:            # Prometheus exemplar → the trace in Tempo
        datasourceUid: tempo
        traceIdLabelName: trace_id
  additionalDataSources:
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring:3200
      jsonData:
        tracesToLogsV2:                       # a span → its log lines in Loki (trace_id is structured metadata)
          datasourceUid: loki
          spanStartTimeShift: -5m
          spanEndTimeShift: 5m
          customQuery: true
          query: '{namespace=~"tenant-.+"} | trace_id="$${__trace.traceId}"'
        serviceMap: { datasourceUid: prometheus }
        nodeGraph: { enabled: true }
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring:3100
      jsonData:
        derivedFields:                        # a log line → its trace
          - name: trace_id
            matcherType: label                # structured metadata field
            matcherRegex: trace_id
            datasourceUid: tempo
            url: '$${__value.raw}'
# kind has no reachable etcd / controller-manager / scheduler / kube-proxy metrics: their targets would only be DOWN
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
