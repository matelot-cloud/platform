{{- if .Values.networkPolicy.enabled }}
# Cell isolation: nothing outside this namespace may talk to its pods,
# except the ingress controller reaching pods explicitly marked as exposed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny-ingress
  labels:
    {{- include "cell.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-same-namespace
  labels:
    {{- include "cell.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-ingress-controller
  labels:
    {{- include "cell.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      secops.io/ingress-exposed: "true"
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace }}
{{- if .Values.observability.metrics.enabled }}
---
# Scrapers (Prometheus, an OTel Collector) from the monitoring namespaces may reach the metrics ports only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-metrics-scrape
  labels:
    {{- include "cell.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- range .Values.observability.metrics.scrapeFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - port: {{ .Values.observability.metrics.port }}
        {{- if .Values.observability.metrics.exporters.enabled }}
        - port: {{ .Values.observability.metrics.exporters.postgres.port }}
        - port: {{ .Values.observability.metrics.exporters.redis.port }}
        - port: 9000   # Keycloak management (health + metrics)
        - port: {{ .Values.observability.metrics.exporters.registryPort }}
        {{- end }}
{{- end }}
{{- end }}
