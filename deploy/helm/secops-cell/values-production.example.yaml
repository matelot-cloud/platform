# Example overrides for a real client cell. Secrets should come from your secret manager
# (e.g. External Secrets Operator writing the same Secret names) rather than plain values.
tenant:
  slug: globex
  name: "Globex Corporation"
  domain: platform.example.com
  adminEmails: ["ciso@globex.com"]

image:
  repository: ghcr.io/matelot-io/api
  tag: "0.1.0"

worker:
  image: { repository: ghcr.io/matelot-io/worker, tag: "0.1.0" }

web:
  image:
    repository: ghcr.io/matelot-io/web
    tag: "0.1.0"
  replicas: 2

api:
  replicas: 2
  corsOrigins: ["https://globex.platform.example.com"]

ingress:
  tls: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt

postgres:
  bundled: false
  externalUrl: postgresql://platform:${DB_PASSWORD}@globex-db.internal:5432/platform
  externalKeycloakJdbcUrl: jdbc:postgresql://globex-db.internal:5432/keycloak
  username: platform
  password: ${DB_PASSWORD}

redis:
  bundled: false
  externalUrl: redis://globex-redis.internal:6379

keycloak:
  bundled: true
  adminPassword: ${KC_ADMIN_PASSWORD}
  allowPasswordGrant: false
  seedUsers: []

backup:
  enabled: true
  schedule: "17 2 * * *"
  pvc:
    enabled: true            # a week of local archives for quick restores …
    size: 20Gi
  retentionDays: 7
  s3:                        # … and every archive off-site; set a lifecycle rule on the bucket for retention
    enabled: true
    bucket: globex-cell-backups
    prefix: cells/globex
    region: eu-central-1
    credentialsSecret: ""    # IRSA / workload identity on the namespace's default service account, or a Secret name

