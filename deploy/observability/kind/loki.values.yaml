# grafana/loki 7.3.0 (Loki 3.6.12) single binary on a filesystem volume, for Matelot on kind: Alloy pushes the
# cells' pod logs here; trace_id / span_id arrive as structured metadata. No caches, canary or gateway (kind).
#   helm upgrade --install loki grafana/loki --version 7.3.0 -n monitoring -f deploy/observability/kind/loki.values.yaml
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig: { replication_factor: 1 }
  storage: { type: filesystem }
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: loki_index_, period: 24h }
  limits_config:
    allow_structured_metadata: true
    retention_period: 48h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
singleBinary:
  replicas: 1
  persistence: { size: 5Gi }
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
