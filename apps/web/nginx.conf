# Serves the built SPA. /config.json is read from /matelot/web/config.json: the image carries the default, a cell mounts
# its own there (Helm: ConfigMap subPath; Compose: the generated file in the config volume). Never cached.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location = /config.json {
        alias /matelot/web/config.json;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # a path that looks like a file (has an extension) is a static asset: it exists or it is a 404 — never index.html
    location ~* \.[a-z0-9]{2,5}$ {
        try_files $uri =404;
    }

    # application routes (no extension) fall back to the SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
