{{- if .Values.keycloak.bundled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-keycloak
  labels:
    {{- include "cell.labels" . | nindent 4 }}
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ .Values.keycloak.adminUser | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.keycloak.adminPassword | quote }}
  KC_DB_USERNAME: {{ .Values.postgres.username | quote }}
  KC_DB_PASSWORD: {{ .Values.postgres.password | quote }}
  {{- if .Values.keycloak.seedAdmins }}
  # initial (temporary) password of the seeded administrators: kubectl -n {{ .Release.Namespace }} get secret {{ .Release.Name }}-keycloak -o jsonpath='{.data.SEED_ADMIN_PASSWORD}' | base64 -d
  SEED_ADMIN_PASSWORD: {{ include "cell.seedAdminPassword" . | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-keycloak-realm
  labels:
    {{- include "cell.labels" . | nindent 4 }}
data:
  realm.json: |-
{{ tpl (.Files.Get "files/realm.json.tpl") . | indent 4 }}
  realm-sync.js: |-
{{ .Files.Get "files/realm-sync.js" | indent 4 }}
{{- if .Values.keycloak.theme.enabled }}
---
# The "matelot" login theme (files/theme/matelot/login: the stock keycloak.v2 layout with our favicon, logo, palette
# and font). Mounted at /opt/keycloak/themes/matelot: keys are the file paths with "/" → "__" (a ConfigMap key cannot
# hold a slash), the volume maps them back. ONE rule decides data vs binaryData — the file extension (png / ico / jpg /
# gif / woff / ttf are binary, everything else text) — because a key present in both is rejected by the API server
# ("duplicate of key present in binaryData"), which `helm template` cannot see. css/cell.css carries this cell's
# overrides (keycloak.theme.logo / colours) and is rendered here, not read from the files.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-keycloak-theme
  labels:
    {{- include "cell.labels" . | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "files/theme/matelot/login/**" }}
{{- $rel := trimPrefix "files/theme/matelot/login/" $path }}
{{- if and (not (regexMatch "\\.(png|ico|jpe?g|gif|woff2?|ttf)$" $path)) (ne $rel "resources/css/cell.css") }}
  {{ $rel | replace "/" "__" }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
  resources__css__cell.css: |-
    /* rendered by the chart from keycloak.theme.* */
    :root {
    {{- with .Values.keycloak.theme.logo }}
      --matelot-logo: url("{{ . }}");
    {{- end }}
    {{- with .Values.keycloak.theme.primaryColor }}
      --matelot-primary: {{ . }};
      --matelot-primary-hover: {{ $.Values.keycloak.theme.primaryColorHover | default . }};
    {{- end }}
    }
binaryData:
{{- range $path, $_ := .Files.Glob "files/theme/matelot/login/**" }}
{{- if regexMatch "\\.(png|ico|jpe?g|gif|woff2?|ttf)$" $path }}
  {{ trimPrefix "files/theme/matelot/login/" $path | replace "/" "__" }}: {{ $.Files.Get $path | b64enc }}
{{- end }}
{{- end }}
{{- end }}
---
# `start --import-realm` imports once (IGNORE_EXISTING): after a scheme or hostname change the clients' redirect URIs in
# the database stay old ("Invalid parameter: redirect_uri"). This hook applies the rendered realm's URL-shaped settings
# (sslRequired, redirectUris, webOrigins, rootUrl…) through the admin API after every install and upgrade, and seeds the
# first administrators (tenant.adminEmails, SEED_ADMIN_PASSWORD, temporary) when they do not exist — existing users,
# roles and anything created by hand are not touched (files/realm-sync.js; the Compose stack runs the same script).
# The last run's Job is kept (deleted only before the next run): `kubectl logs job/<release>-realm-sync` shows what it did.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-realm-sync
  labels:
    {{- include "cell.labels" . | nindent 4 }}
    app.kubernetes.io/name: realm-sync
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: realm-sync
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: realm-sync
          image: {{ include "cell.image" . | quote }}
          command: ["node", "/realm/realm-sync.js", {{ printf "http://%s-keycloak:8080" .Release.Name | quote }}, "/realm/realm.json"]
          env:
            - name: REALM_SYNC_TIMEOUT
              value: "540"
            {{- if .Values.keycloak.seedAdmins }}
            - name: SEED_USERS
              value: {{ join "," .Values.tenant.adminEmails | quote }}
            - name: SEED_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-keycloak, key: SEED_ADMIN_PASSWORD }
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-keycloak
          volumeMounts:
            - name: realm
              mountPath: /realm
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: realm
          configMap:
            name: {{ .Release.Name }}-keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-keycloak
  labels:
    {{- include "cell.labels" . | nindent 4 }}
    app.kubernetes.io/name: keycloak
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-keycloak
  labels:
    {{- include "cell.labels" . | nindent 4 }}
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        {{- include "cell.podLabels" . | nindent 8 }}
        app.kubernetes.io/name: keycloak
        secops.io/ingress-exposed: "true"
      annotations:
        checksum/realm: {{ tpl (.Files.Get "files/realm.json.tpl") . | sha256sum }}
{{- if .Values.keycloak.theme.enabled }}
        checksum/theme: {{ print (toJson .Values.keycloak.theme) (.Files.Glob "files/theme/matelot/login/**" | toJson | sha256sum) | sha256sum }}
{{- end }}
    spec:
      {{- if .Values.postgres.bundled }}
      initContainers:
        # Keycloak exits on an unresolvable database host; on a fresh install the Postgres Service may not have an
        # endpoint yet, so wait for it here instead of paying a restart.
        - name: wait-for-postgres
          image: {{ .Values.postgres.image | quote }}
          command: ["sh", "-c", "until pg_isready -h {{ .Release.Name }}-postgres -p 5432 -U {{ .Values.postgres.username }} > /dev/null 2>&1; do echo 'waiting for postgres'; sleep 2; done"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
      {{- end }}
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image | quote }}
          args: ["start", "--import-realm"]
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-keycloak
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: {{ include "cell.keycloakJdbcUrl" . | quote }}
            - name: KC_HOSTNAME
              value: {{ printf "%s://%s" (include "cell.scheme" .) (include "cell.authHost" .) | quote }}
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
{{- if .Values.keycloak.theme.enabled }}
            - name: theme
              mountPath: /opt/keycloak/themes/matelot
              readOnly: true
{{- end }}
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 30
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
      volumes:
        - name: realm
          configMap:
            name: {{ .Release.Name }}-keycloak-realm
            items: [{ key: realm.json, path: realm.json }]   # only the realm: the import directory must hold JSON only
{{- if .Values.keycloak.theme.enabled }}
        - name: theme
          configMap:
            name: {{ .Release.Name }}-keycloak-theme
            items:
{{- range $path, $_ := .Files.Glob "files/theme/matelot/login/**" }}
{{- $rel := trimPrefix "files/theme/matelot/login/" $path }}
              - { key: {{ $rel | replace "/" "__" | quote }}, path: {{ $rel | quote }} }
{{- end }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-keycloak
  labels:
    {{- include "cell.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ include "cell.authHost" . | quote }}]
      secretName: {{ .Release.Name }}-keycloak-tls
  {{- end }}
  rules:
    - host: {{ include "cell.authHost" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-keycloak
                port:
                  name: http
{{- end }}
{{- end }}
