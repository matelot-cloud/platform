name: publish
on:
  push:
    tags: ["v*"]          # git tag v0.1.0 && git push --tags
permissions:
  contents: write
  id-token: write          # npm provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: https://registry.npmjs.org, cache: npm }
      - run: npm ci
      - run: npm run build && npm test
      - run: |
          TAG=${GITHUB_REF_NAME#v}
          node -e "const p=require('./package.json'); if(p.version!=='$TAG'){console.error('package.json version '+p.version+' != tag '+'$TAG'); process.exit(1)}"
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Move the floating major tag (v1) so `uses: …/secops-platform-cli@v1` follows releases
      - run: |
          MAJOR=v${GITHUB_REF_NAME#v}; MAJOR=${MAJOR%%.*}
          git config user.name github-actions; git config user.email github-actions@github.com
          git tag -f "$MAJOR" && git push -f origin "$MAJOR"
