# Cell: Acme Corporation (acme) — one file per cell, committed; secrets stay out (the ${VAR} placeholders are filled from
# the environment by scripts/cell-provision.sh at apply time). Anything not set here keeps the chart default.
tenant:
  slug: acme
  name: "Acme Corporation"
  domain: platform.local            # app: acme.platform.local  auth: auth-acme.platform.local  registry: registry-acme.platform.local
  adminEmails: ["admin@acme.test"]       # first login of these e-mails receives ORG_ADMIN on the root organization

image:
  repository: ghcr.io/matelot-cloud/api
  tag: "0.1.0"                  # all four images move together: scripts/cell-provision.sh apply --tag X
worker:
  image: { repository: ghcr.io/matelot-cloud/worker, tag: "0.1.0" }
web:
  image: { repository: ghcr.io/matelot-cloud/web, tag: "0.1.0" }
managedRunners:
  image: { repository: ghcr.io/matelot-cloud/runner, tag: "0.1.0" }
  replicas: 1
imagePullSecrets: []            # e.g. [{ name: ghcr-pull }] — create the Secret in tenant-acme first

api:
  replicas: 1
  corsOrigins: ["https://acme.platform.local"]
  extraEnv: {}                  # SMTP_HOST, SMTP_PORT, SMTP_FROM, … for e-mail notifications (secrets via ${VAR})

ingress:
  className: nginx
  tls: false
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt

postgres:
  bundled: true                 # production: bundled: false + externalUrl / externalKeycloakJdbcUrl (managed database)
  storage: 20Gi
  password: ${DB_PASSWORD}
redis:
  bundled: true
keycloak:
  bundled: true
  adminPassword: ${KC_ADMIN_PASSWORD}
  allowPasswordGrant: false
  seedUsers: []                 # users come from the customer's IdP (docs/cell-provisioning.md §Handover)

backup:
  enabled: true
  schedule: "17 2 * * *"
  retentionDays: 7
  pvc: { enabled: true, size: 20Gi }
  s3:
    enabled: false              # recommended: enabled, bucket, prefix: cells/acme, region, credentialsSecret or pod identity
    bucket: ""
    prefix: cells/acme
