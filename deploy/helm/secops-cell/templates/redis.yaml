{{- if .Values.redis.bundled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    {{- include "cell.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    {{- include "cell.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        {{- include "cell.podLabels" . | nindent 8 }}
        app.kubernetes.io/name: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        {{- if and .Values.observability.metrics.enabled .Values.observability.metrics.exporters.enabled }}
        # redis_exporter (docs/observability.md): redis_* metrics on the pod network only (Service <release>-redis-metrics)
        - name: metrics
          image: {{ .Values.observability.metrics.exporters.redis.image | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.observability.metrics.exporters.redis.port }}
          args: ["-redis.addr=redis://localhost:6379", {{ printf "-web.listen-address=:%v" .Values.observability.metrics.exporters.redis.port | quote }}]
          readinessProbe:
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 30
          resources:
            {{- toYaml .Values.observability.metrics.exporters.redis.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        {{- end }}
{{- end }}
