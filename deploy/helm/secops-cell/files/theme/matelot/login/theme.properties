# Matelot login theme: the stock keycloak.v2 layout and behaviour (sign-in, OTP, password reset, consent, errors) with
# our branding only — favicon, logo, tenant name, palette (light + dark), font. Nothing here overrides a template, so
# a Keycloak upgrade keeps working; css/cell.css is rendered per cell (logo / primary colour overrides).
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/matelot.css css/cell.css
scripts=js/matelot.js
