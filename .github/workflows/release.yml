# Release: tag vX.Y.Z on main → images, chart, public repositories, GitHub Release. See docs/release-process.md.
#
#   images   ghcr.io/matelot-cloud/{api,web,worker,runner}:X.Y.Z (+ vX.Y.Z, + latest unless pre-release), linux/amd64 + arm64,
#            cosign-signed (keyless, GitHub OIDC), SPDX SBOM attached as an attestation (syft)
#   chart    oci://ghcr.io/matelot-cloud/charts/secops-cell:X.Y.Z (appVersion X.Y.Z, signed); chart folder + backup/restore
#            scripts synced to matelot-cloud/helm-charts
#   compose  deploy/compose (+ backup/restore scripts) synced to matelot-cloud/matelot → docker/, .env.example pinned to X.Y.Z
#   docs     rendered into matelot-cloud/website: docs/vX.Y/ and docs/latest/ (Pages deploys on that push)
#   release  GitHub Release vX.Y.Z in matelot-cloud/matelot: the CHANGELOG section + image and chart digests
#
# Secrets: GITHUB_TOKEN (ghcr, this repo) · PUBLIC_REPOS_TOKEN (repository secret on platform — organization secrets
# are not available to private repositories on the Free plan: fine-grained PAT, Contents read/write on
# matelot-cloud/website, matelot-cloud/helm-charts, matelot-cloud/matelot) for the cross-repository pushes and the release.
# One-time: organization → Packages → "Package creation: Public" enabled, then after the first run make the five
# packages public (Packages → package → Package settings → Danger zone → Change visibility), otherwise customers
# cannot pull. Pre-release tags (v1.2.0-rc.1) publish everything but `latest`
# and mark the GitHub Release as pre-release.
name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

# ORG is the single place the GitHub organization is named in this workflow (docs, chart values and the website carry
# their own copies; scripts/check-forbidden.sh fails CI on any leftover of a previous name).
env:
  REGISTRY: ghcr.io
  ORG: matelot-cloud
  SITE: https://matelot.cloud
  CHART_DIR: deploy/helm/secops-cell
  CHART_NAME: secops-cell

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}       # 1.2.3 or 1.2.3-rc.1
      line: ${{ steps.v.outputs.line }}             # v1.2  (docs folder)
      prerelease: ${{ steps.v.outputs.prerelease }} # true / false
    steps:
      - id: v
        run: |
          tag="${GITHUB_REF_NAME}"; version="${tag#v}"
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          line="v$(echo "$version" | cut -d. -f1,2)"
          echo "version=$version" >> "$GITHUB_OUTPUT"; echo "line=$line" >> "$GITHUB_OUTPUT"; echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "tag $tag → version $version, docs $line, prerelease $pre"

  images:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 25          # a multi-arch build that does not finish in 25 min is hung (the arm64 leg under QEMU stalled for 3 h once): fail fast, re-run the failed jobs
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless
    strategy:
      fail-fast: false
      matrix:
        include:
          # context: the runner image builds from its own folder (as the Makefile does); the others from the repo root.
          # The worker is a second target of the api Dockerfile: built in the api job right after the api image, on the
          # same builder, so every stage up to the final one is a cache hit instead of a second full multi-arch build.
          - { name: api,    context: ., file: apps/api/Dockerfile,    target: runtime, also: worker, also_target: worker }
          - { name: web,    context: ., file: apps/web/Dockerfile,    target: "", also: "", also_target: "" }
          - { name: runner, context: apps/runner, file: apps/runner/Dockerfile, target: "", also: "", also_target: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.name }}
          flavor: latest=${{ needs.version.outputs.prerelease == 'false' }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=Matelot ${{ matrix.name }}
            org.opencontainers.image.vendor=Matelot
            org.opencontainers.image.url=${{ env.SITE }}/
            org.opencontainers.image.documentation=${{ env.SITE }}/docs/latest/install.html
            org.opencontainers.image.source=https://github.com/${{ env.ORG }}/matelot
            org.opencontainers.image.licenses=LicenseRef-Matelot-EULA
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_BUILT_AT=${{ github.event.head_commit.timestamp || github.event.repository.pushed_at }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Sign the image and attach its SBOM (keyless, GitHub OIDC)
        env:
          NAME: ${{ matrix.name }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash .github/scripts/sign-image.sh
      - uses: actions/upload-artifact@v7
        with: { name: "digest-${{ matrix.name }}", path: "digest-${{ matrix.name }}.txt" }
      - uses: actions/upload-artifact@v7
        with: { name: "sbom-${{ matrix.name }}", path: "sbom-${{ matrix.name }}.spdx.json" }
      # ---- second target of the same Dockerfile (the worker, from the api job)
      - id: meta-also
        if: matrix.also != ''
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.also }}
          flavor: latest=${{ needs.version.outputs.prerelease == 'false' }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=Matelot ${{ matrix.also }}
            org.opencontainers.image.vendor=Matelot
            org.opencontainers.image.url=${{ env.SITE }}/
            org.opencontainers.image.documentation=${{ env.SITE }}/docs/latest/install.html
            org.opencontainers.image.source=https://github.com/${{ env.ORG }}/matelot
            org.opencontainers.image.licenses=LicenseRef-Matelot-EULA
      - id: build-also
        if: matrix.also != ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.also_target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-also.outputs.tags }}
          labels: ${{ steps.meta-also.outputs.labels }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_BUILT_AT=${{ github.event.head_commit.timestamp || github.event.repository.pushed_at }}
          provenance: false
          cache-from: |
            type=gha,scope=${{ matrix.name }}
            type=gha,scope=${{ matrix.also }}
          cache-to: type=gha,scope=${{ matrix.also }},mode=max
      - name: Sign the second image and attach its SBOM
        if: matrix.also != ''
        env:
          NAME: ${{ matrix.also }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.also }}@${{ steps.build-also.outputs.digest }}
          DIGEST: ${{ steps.build-also.outputs.digest }}
        run: bash .github/scripts/sign-image.sh
      - uses: actions/upload-artifact@v7
        if: matrix.also != ''
        with: { name: "digest-${{ matrix.also }}", path: "digest-${{ matrix.also }}.txt" }
      - uses: actions/upload-artifact@v7
        if: matrix.also != ''
        with: { name: "sbom-${{ matrix.also }}", path: "sbom-${{ matrix.also }}.spdx.json" }

  chart:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with: { version: v4.3.1 }   # pinned: the version the chart job ran green with; bump deliberately (CI and release together)
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v4   # cosign reads Docker's credential store; `helm registry login` does not write it
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Package and push the chart as OCI
        id: push
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          helm lint "$CHART_DIR"
          helm package "$CHART_DIR" --version "$VERSION" --app-version "$VERSION" --destination out
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "out/$CHART_NAME-$VERSION.tgz" "oci://$REGISTRY/$ORG/charts" 2>&1 | tee push.log
          digest=$(sed -n 's/^Digest: *//p' push.log)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          bash .github/scripts/retry.sh "cosign sign chart" cosign sign --yes "$REGISTRY/$ORG/charts/$CHART_NAME@$digest"
      - name: Sync the chart folder to matelot-cloud/helm-charts
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TOKEN: ${{ secrets.PUBLIC_REPOS_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/$ORG/helm-charts.git" public
          rm -rf "public/charts/$CHART_NAME" public/scripts; mkdir -p public/charts public/scripts/lib
          cp -r "$CHART_DIR" "public/charts/$CHART_NAME"
          cp scripts/cell-backup.sh scripts/cell-restore.sh public/scripts/; cp scripts/lib/wait.sh scripts/lib/cellwait.py public/scripts/lib/
          # the published copy carries the release version (the source keeps a development version)
          sed -i "s/^version: .*/version: $VERSION/; s/^appVersion: .*/appVersion: \"$VERSION\"/" "public/charts/$CHART_NAME/Chart.yaml"
          cd public
          git config user.name "matelot-release[bot]"; git config user.email "release@matelot.io"
          git add -A
          git diff --cached --quiet && echo "chart unchanged" || { git commit -m "secops-cell $VERSION (from platform ${GITHUB_SHA::7})"; git push; }
          git tag -f "$CHART_NAME-$VERSION" && git push -f origin "$CHART_NAME-$VERSION"

  compose:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
      - name: Sync the Docker Compose stack to matelot-cloud/matelot (docker/)
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TOKEN: ${{ secrets.PUBLIC_REPOS_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/$ORG/matelot.git" public
          rm -rf public/docker; mkdir -p public/docker/scripts/lib
          cp -r deploy/compose/. public/docker/
          rm -f public/docker/.env
          cp scripts/cell-backup.sh scripts/cell-restore.sh public/docker/scripts/
          cp scripts/lib/compose.sh scripts/lib/wait.sh scripts/lib/cellwait.py public/docker/scripts/lib/
          # the published stack runs this release (a pre-release keeps `latest` out of the example)
          sed -i "s/^MATELOT_VERSION=.*/MATELOT_VERSION=$VERSION/" public/docker/.env.example
          cd public
          git config user.name "matelot-release[bot]"; git config user.email "release@matelot.io"
          git add -A docker
          git diff --cached --quiet && echo "compose unchanged" || { git commit -m "docker compose stack $VERSION (from platform ${GITHUB_SHA::7})"; git push; }

  docs:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter @secops/web   # `marked`
      - run: node tools/docs-site/test.mjs
      - name: Render docs/${{ needs.version.outputs.line }} and docs/latest into matelot-cloud/website
        env:
          LINE: ${{ needs.version.outputs.line }}
          VERSION: ${{ needs.version.outputs.version }}
          TOKEN: ${{ secrets.PUBLIC_REPOS_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/$ORG/website.git" public
          node tools/docs-site/build.mjs --out "public/docs/$LINE" --version "$LINE"
          node tools/docs-site/build.mjs --out public/docs/latest --version latest
          cd public && node tools/test.mjs && node tools/build.mjs --check
          git config user.name "matelot-release[bot]"; git config user.email "release@matelot.io"
          git add -A docs
          git diff --cached --quiet && echo "docs unchanged" || { git commit -m "docs: $LINE from platform v$VERSION"; git push; }
      - name: Trigger the website's Pages workflow (deploys, and heals the Pages source)
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPOS_TOKEN }}
        run: gh api -X POST "repos/$ORG/website/dispatches" -f event_type=docs-synced

  release:
    needs: [version, images, chart, compose, docs]
    # Runs when every upstream job succeeded — in this attempt or an earlier one: "Re-run failed jobs" re-runs only the
    # failed image leg and this job, and the artifacts of earlier attempts stay available, so one hung image build is
    # recovered by a single re-run instead of a new tag.
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.images.result == 'success' && needs.chart.result == 'success' && needs.compose.result == 'success' && needs.docs.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { pattern: "digest-*", merge-multiple: true, path: digests }
      - uses: actions/download-artifact@v8
        with: { pattern: "sbom-*", path: sboms }
      - name: Every image has a digest (a partial re-run must not publish a release with an image missing)
        run: |
          for n in api worker web runner; do [ -s "digests/digest-$n.txt" ] || { echo "::error::no digest for $n — its image job did not finish; re-run the failed jobs"; exit 1; }; done
          cat digests/*.txt
      - name: "Release notes: CHANGELOG section + digests"
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
        run: |
          # the section must exist for a final release; a pre-release may fall back to the newest section
          if bash scripts/changelog-section.sh "v$VERSION" > notes.md; then :
          elif [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then echo "::warning::CHANGELOG.md has no '## v$VERSION' section; using the newest one (fine for a pre-release)"
          else echo "::error::CHANGELOG.md has no '## v$VERSION' section — add it at the top (docs/release-process.md § Cutting a release) and re-tag"; exit 1; fi
          {
            echo; echo "## Artifacts"; echo
            echo '```'
            while read -r name digest; do echo "ghcr.io/$ORG/$name:$VERSION@$digest"; done < <(cat digests/*.txt | sort)
            echo "oci://ghcr.io/$ORG/charts/$CHART_NAME:$VERSION@$CHART_DIGEST"
            echo '```'
            echo
            echo "Images and chart are signed with cosign (keyless, GitHub OIDC) and the images carry SPDX SBOM attestations:"
            echo '```'
            echo "cosign verify ghcr.io/$ORG/api:$VERSION --certificate-identity-regexp 'https://github.com/$ORG/platform/' --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "cosign verify-attestation --type spdxjson ghcr.io/$ORG/api:$VERSION --certificate-identity-regexp 'https://github.com/$ORG/platform/' --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo "Docker Compose: https://github.com/$ORG/matelot/tree/main/docker (compose.yaml for $VERSION; \`MATELOT_VERSION=$VERSION\` in .env, then \`docker compose pull && docker compose up -d\`)."
            echo
            echo "Images are tagged \`$VERSION\` and \`v$VERSION\` (the git tag); \`MATELOT_VERSION\` and the chart's \`image.tag\` take the bare version, \`$VERSION\`."
            echo
            echo "Install or upgrade: $SITE/docs/${{ needs.version.outputs.line }}/install.html"
          } >> notes.md
          for d in sboms/*/; do n=$(basename "$d" | sed 's/^sbom-//'); cp "$d/sbom-$n.spdx.json" "matelot-$n-$VERSION.spdx.json"; done
          cat notes.md
      - name: Create the GitHub Release in matelot-cloud/matelot
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPOS_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        # retried (3 attempts, 30 s / 60 s) and idempotent: an existing release gets its notes and assets updated
        run: bash .github/scripts/publish-release.sh
