# CLI release: tag cli-vX.Y.Z (= apps/cli/package.json version) → build + test, publish the package to
# matelot-cloud/setup-cli (source + action.yml; tags vX.Y.Z and the moving vX), and to npm when NPM_TOKEN is set.
# Every release attaches the npm package (matelot-cli-X.Y.Z.tgz + matelot-cli.tgz) to a GitHub Release in setup-cli;
# customers install from that URL (releases/latest/download/matelot-cli.tgz) or use the action (uses: …/setup-cli@v2),
# which installs the tag's source archive. Never the git form: npm 10 leaves it as a dangling symlink.
name: publish-cli
on:
  push:
    tags: ["cli-v*"]        # git tag cli-v2.19.2 && git push origin cli-v2.19.2
permissions:
  contents: read
  id-token: write           # npm provenance (Sigstore attestation of the build)
env:
  ORG: matelot-cloud
jobs:
  publish:
    outputs: { version: "${{ steps.v.outputs.version }}" }
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/cli } }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, registry-url: https://registry.npmjs.org, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm test
      - name: Tag matches package.json
        id: v
        run: |
          TAG=${GITHUB_REF_NAME#cli-v}; echo "version=$TAG" >> "$GITHUB_OUTPUT"
          node -e "const p=require('./package.json'); if(p.version!=='$TAG'){console.error('package.json version '+p.version+' != tag '+'$TAG'); process.exit(1)}"
      - name: Publish to matelot-cloud/setup-cli (source + compiled dist/, no build on install)
        env:
          TOKEN: ${{ secrets.PUBLIC_REPOS_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#cli-v}; MAJOR=v${VERSION%%.*}
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/$ORG/setup-cli.git" /tmp/setup-cli
          cd /tmp/setup-cli
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name README.md -exec rm -rf {} +
          S="$GITHUB_WORKSPACE/apps/cli"
          cp -r "$S/src" "$S/examples" "$S/package-lock.json" "$S/tsconfig.json" "$S/action.yml" "$S/LICENSE" .
          mkdir dist && find "$S/dist" -name '*.js' ! -name '*.test.js' -exec cp {} dist/ \;
          # the published package carries dist/: `npm install -g github:…#tag` runs no build, so no `prepare`, no devDependencies
          node -e "const p=require('$S/package.json'); delete p.scripts.prepare; delete p.scripts.prepublishOnly; delete p.devDependencies; p.files=['dist','README.md']; require('fs').writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')"
          [ -f README.md ] || cp "$S/README.md" README.md   # the public README is maintained in the public repo
          printf 'node_modules/\n' > .gitignore
          chmod +x dist/index.js
          git config user.name "matelot-release[bot]"; git config user.email "release@matelot.io"
          git add -A
          git diff --cached --quiet && echo "unchanged" || git commit -m "matelot-cli $VERSION (from platform ${GITHUB_SHA::7})"
          git push
          git tag -f "v$VERSION" && git tag -f "$MAJOR" && git push -f origin "v$VERSION" "$MAJOR"
      - name: GitHub Release in setup-cli with the npm package attached
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPOS_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#cli-v}
          mkdir -p /tmp/pack && cd /tmp/setup-cli && npm pack --pack-destination /tmp/pack > /dev/null
          cp "/tmp/pack/matelot-cli-$VERSION.tgz" /tmp/pack/matelot-cli.tgz     # fixed name for releases/latest/download/
          flags=(); case "$VERSION" in *-*) flags+=(--prerelease);; esac
          notes="Matelot CLI $VERSION. Install: \`npm install -g https://github.com/$ORG/setup-cli/releases/download/v$VERSION/matelot-cli-$VERSION.tgz\` (newest: \`releases/latest/download/matelot-cli.tgz\`); GitHub Actions: \`uses: $ORG/setup-cli@v$VERSION\`. Built from platform ${GITHUB_SHA::7}."
          if gh release view "v$VERSION" --repo "$ORG/setup-cli" > /dev/null 2>&1; then
            gh release upload "v$VERSION" --repo "$ORG/setup-cli" --clobber "/tmp/pack/matelot-cli-$VERSION.tgz" /tmp/pack/matelot-cli.tgz
          else
            gh release create "v$VERSION" --repo "$ORG/setup-cli" --title "matelot-cli $VERSION" --notes "$notes" "${flags[@]}" "/tmp/pack/matelot-cli-$VERSION.tgz" /tmp/pack/matelot-cli.tgz
          fi
      - name: Publish to npm (when NPM_TOKEN is configured)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN not set: skipping npm publish"; exit 0; fi
          npm publish --access public --provenance

  install-test:
    # exactly the documented commands, on a machine that has nothing but Node: no checkout, no pnpm, no build
    needs: publish
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: "Pinned release asset: releases/download/vX.Y.Z/matelot-cli-X.Y.Z.tgz (the documented command)"
        run: |
          npm install -g "https://github.com/$ORG/setup-cli/releases/download/v$VERSION/matelot-cli-$VERSION.tgz"
          test "$(matelot --version)" = "$VERSION" && test "$(secops --version)" = "$VERSION"
          npm uninstall -g matelot-cli
      - name: "Newest release: releases/latest/download/matelot-cli.tgz (the documented command)"
        if: ${{ !contains(needs.publish.outputs.version, '-') }}
        run: |
          npm install -g "https://github.com/$ORG/setup-cli/releases/latest/download/matelot-cli.tgz"
          test "$(matelot --version)" = "$VERSION" && test "$(secops --version)" = "$VERSION"
          npm uninstall -g matelot-cli
      - name: Source archive of the moving major tag (what the GitHub Action installs for uses@vN)
        run: |
          npm install -g "https://github.com/$ORG/setup-cli/archive/refs/tags/v${VERSION%%.*}.tar.gz"
          test "$(matelot --version)" = "$VERSION" && test "$(secops --version)" = "$VERSION"
          test -d "$(npm root -g)/matelot-cli/dist"     # a real directory, not a symlink into npm's cache
