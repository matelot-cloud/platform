apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-api-config
  labels:
    {{- include "cell.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  PORT: "3000"
  LOG_LEVEL: {{ .Values.api.logLevel | quote }}
  APP_VERSION: {{ .Values.image.tag | default .Chart.AppVersion | quote }}   # shown as "API x.y.z" in the web app footer and GET /api/v1/meta
  KEYCLOAK_ISSUER: {{ include "cell.keycloakIssuer" . | quote }}
  KEYCLOAK_JWKS_URI: {{ include "cell.keycloakJwksUri" . | quote }}
  KEYCLOAK_AUDIENCE: {{ .Values.keycloak.audience | quote }}
  BOOTSTRAP_ORG_SLUG: {{ .Values.tenant.slug | quote }}
  BOOTSTRAP_ORG_NAME: {{ .Values.tenant.name | quote }}
  BOOTSTRAP_ADMIN_EMAILS: {{ join "," .Values.tenant.adminEmails | quote }}
  CORS_ORIGINS: {{ join "," .Values.api.corsOrigins | quote }}
  MATELOT_LICENSE: {{ .Values.license | quote }}
  WEB_BASE_URL: {{ printf "%s://%s" (include "cell.scheme" .) (include "cell.apiHost" .) | quote }}
  # the public base of the API behind the ingress: OAuth/OIDC metadata (matelot login, MCP), keyless identity issuer
  API_PUBLIC_URL: {{ printf "%s://%s" (include "cell.scheme" .) (include "cell.apiHost" .) | quote }}
  GITHUB_APP_ID: {{ .Values.github.appId | quote }}
  GITHUB_APP_SLUG: {{ .Values.github.slug | quote }}
  GITHUB_API_URL: {{ .Values.github.apiUrl | quote }}
  GITHUB_URL: {{ .Values.github.url | quote }}
  {{- range $key, $value := .Values.api.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
