# Matelot security workflow for GitLab CI — include in .gitlab-ci.yml of the service repository.
# CI/CD variables (Settings → CI/CD → Variables): MATELOT_URL, MATELOT_SERVICE_ID, MATELOT_ENV_DEV, MATELOT_ENV_TEST,
# MATELOT_ENV_PROD, and masked MATELOT_KEY_ID + MATELOT_SECRET (from `matelot ci-token create … --preset full`).
stages: [security, deploy]

.matelot:
  image: node:22-alpine
  before_script:
    - apk add --no-cache git jq
    - npm install -g "github:matelot-io/setup-cli#v2"
    - matelot whoami

security:
  extends: .matelot
  stage: security
  script:
    - matelot pipeline --service "$MATELOT_SERVICE_ID" --ref "$CI_COMMIT_SHA" --wait --timeout 900
    - matelot findings summary --project "$(matelot service show --service "$MATELOT_SERVICE_ID" --json | jq -r .projectId)"

deploy-dev:
  extends: .matelot
  stage: deploy
  rules: [{ if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH' }]
  script:
    - matelot deploy --env "$MATELOT_ENV_DEV" --version "main-${CI_COMMIT_SHORT_SHA}" --commit "$CI_COMMIT_SHA"

deploy-test:
  extends: .matelot
  stage: deploy
  rules: [{ if: '$CI_COMMIT_TAG =~ /^v/' }]
  script:
    - matelot gate --env "$MATELOT_ENV_TEST" --version "${CI_COMMIT_TAG#v}" || true   # warn-only policy
    - matelot deploy --env "$MATELOT_ENV_TEST" --version "${CI_COMMIT_TAG#v}" --commit "$CI_COMMIT_SHA"

deploy-prod:
  extends: .matelot
  stage: deploy
  needs: [deploy-test]
  rules: [{ if: '$CI_COMMIT_TAG =~ /^v/', when: manual }]
  environment: production
  script:
    - matelot gate --env "$MATELOT_ENV_PROD" --version "${CI_COMMIT_TAG#v}"          # blocking: exit 2 fails the job
    - matelot deploy --env "$MATELOT_ENV_PROD" --version "${CI_COMMIT_TAG#v}" --commit "$CI_COMMIT_SHA"
    - REL=$(matelot releases list --service "$MATELOT_SERVICE_ID" --json | jq -r --arg v "${CI_COMMIT_TAG#v}" '.[] | select(.version==$v) | .id' | head -1)
    - matelot evidence export --release "$REL" --out "evidence-${CI_COMMIT_TAG#v}.zip" && matelot evidence verify "evidence-${CI_COMMIT_TAG#v}.zip"
  artifacts: { paths: ["evidence-*.zip"], expire_in: 1 year }
