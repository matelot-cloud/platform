# Matelot security workflow — copy to .github/workflows/matelot.yml in the service repository.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   MATELOT_URL          http://localhost:3000   (self-hosted runner) / https://matelot.example.com
#   MATELOT_SERVICE_ID   the service id
#   MATELOT_ENV_DEV / MATELOT_ENV_TEST / MATELOT_ENV_PROD   environment ids
# Repository secrets: MATELOT_KEY_ID, MATELOT_SECRET (from `matelot ci-token create … --preset full`).
#
# Flow: every push/PR → security pipeline (SBOM, secrets, IaC) + findings summary in the job summary.
#       push to main   → deploy dev.
#       tag vX.Y.Z     → gate test → deploy test → gate prod (blocking) → deploy prod → signed evidence bundle as artifact.
name: matelot
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:
  workflow_dispatch:
    inputs:
      environment: { description: "Deploy to", type: choice, options: [dev, test, prod], default: dev }
      version: { description: "Version (defaults to tag / main-<sha>)", required: false }

env:
  RUNS_ON: self-hosted   # ubuntu-latest once the platform has a public URL

jobs:
  security:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: matelot-cloud/setup-cli@v2
        with: { url: "${{ vars.MATELOT_URL }}", key-id: "${{ secrets.MATELOT_KEY_ID }}", secret: "${{ secrets.MATELOT_SECRET }}" }
      - name: Security pipeline (SBOM, secrets, IaC)
        run: matelot pipeline --service "${{ vars.MATELOT_SERVICE_ID }}" --ref "${{ github.sha }}" --wait --timeout 900
      - name: Findings summary
        if: always()
        run: |
          {
            echo "## Findings"; echo '```'
            matelot findings summary --project "$(matelot service show --service "${{ vars.MATELOT_SERVICE_ID }}" --json | jq -r .projectId)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  version:
    runs-on: self-hosted
    outputs: { version: "${{ steps.v.outputs.version }}" }
    steps:
      - id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then V="${{ inputs.version }}";
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}";
          else V="main-${GITHUB_SHA::7}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  deploy-dev:
    needs: [security, version]
    if: github.ref == 'refs/heads/main' || inputs.environment == 'dev'
    runs-on: self-hosted
    steps:
      - uses: matelot-cloud/setup-cli@v2
        with: { url: "${{ vars.MATELOT_URL }}", key-id: "${{ secrets.MATELOT_KEY_ID }}", secret: "${{ secrets.MATELOT_SECRET }}" }
      - run: matelot deploy --env "${{ vars.MATELOT_ENV_DEV }}" --version "${{ needs.version.outputs.version }}" --commit "${{ github.sha }}"

  deploy-test:
    needs: [security, version]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.environment == 'test' || inputs.environment == 'prod'
    runs-on: self-hosted
    steps:
      - uses: matelot-cloud/setup-cli@v2
        with: { url: "${{ vars.MATELOT_URL }}", key-id: "${{ secrets.MATELOT_KEY_ID }}", secret: "${{ secrets.MATELOT_SECRET }}" }
      - name: Gate (warn-only policy: reports, never blocks)
        run: matelot gate --env "${{ vars.MATELOT_ENV_TEST }}" --version "${{ needs.version.outputs.version }}" || true
      - run: matelot deploy --env "${{ vars.MATELOT_ENV_TEST }}" --version "${{ needs.version.outputs.version }}" --commit "${{ github.sha }}"

  deploy-prod:
    needs: [deploy-test, version]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.environment == 'prod'
    runs-on: self-hosted
    environment: production   # optional: GitHub approval gate on top of the policy gate
    steps:
      - uses: matelot-cloud/setup-cli@v2
        with: { url: "${{ vars.MATELOT_URL }}", key-id: "${{ secrets.MATELOT_KEY_ID }}", secret: "${{ secrets.MATELOT_SECRET }}" }
      - name: Production gate (blocking — exit 2 fails the job, Slack gets gate.fail)
        run: matelot gate --env "${{ vars.MATELOT_ENV_PROD }}" --version "${{ needs.version.outputs.version }}"
      - run: matelot deploy --env "${{ vars.MATELOT_ENV_PROD }}" --version "${{ needs.version.outputs.version }}" --commit "${{ github.sha }}"
      - name: Signed CRA evidence bundle
        run: |
          REL=$(matelot releases list --service "${{ vars.MATELOT_SERVICE_ID }}" --json | jq -r '.[] | select(.version=="${{ needs.version.outputs.version }}") | .id' | head -1)
          matelot evidence export --release "$REL" --out "evidence-${{ needs.version.outputs.version }}.zip"
          matelot evidence verify "evidence-${{ needs.version.outputs.version }}.zip"
      - uses: actions/upload-artifact@v4
        with: { name: "evidence-${{ needs.version.outputs.version }}", path: "evidence-*.zip" }
