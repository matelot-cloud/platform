name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: platform, POSTGRES_PASSWORD: platform, POSTGRES_DB: platform }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @secops/api typecheck
      - run: pnpm --filter @secops/api test
      - run: pnpm --filter @secops/api build
      - name: Migrations apply on a fresh database
        run: node apps/api/dist/migrate.js
        env: { DATABASE_URL: "postgresql://platform:platform@localhost:5432/platform" }
      - name: Schema, migrations and snapshot are in sync (drizzle-kit generate must be a no-op)
        run: |
          pnpm --filter @secops/api db:generate
          if [ -n "$(git status --porcelain apps/api/drizzle)" ]; then
            echo "::error::drizzle-kit generate produced changes: the schema differs from the last snapshot. Every schema change ships its migration SQL and the regenerated snapshot in the same commit (CLAUDE.md § Working on the schema)."
            git status --porcelain apps/api/drizzle; exit 1
          fi

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @secops/web build
      - run: pnpm --filter @secops/runner build
      - run: pnpm --filter secops-platform-cli build && pnpm --filter secops-platform-cli test
      - run: pnpm --filter @secops/web test
      - name: Icons are generated from favicon.svg / logo-512.png (favicon.ico frames, PNG sizes, the login theme's copies) — never resampled by hand
        run: pnpm --filter @secops/icons test
      - name: Documentation renders and every link resolves
        run: node tools/docs-site/test.mjs && node tools/docs-site/build.mjs --check

  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Only the monorepo's top-level directories exist (stale copies from old drops fail here)
        run: bash scripts/check-layout.sh
      - name: No retired names survive (old organization, old CLI mirror, old domain)
        run: bash scripts/check-forbidden.sh
      - name: Workflow guards (timeouts on every job, npm pack directory, worker built from the api job, release re-run safe)
        run: bash scripts/check-workflows.sh
      - name: Compose init script (generated files survive hostile values; secrets generated once)
        run: bash deploy/compose/init/compose-init.test.sh
      - name: "cell-provision.sh: new picks the issuer per context; preflight reads the generated values as YAML (inline comments)"
        run: bash scripts/cell-provision.test.sh
      - name: Compose backup/restore helpers (archive copy-out / secrets copy-in stream through the container, no bind mounts; runs as the unprivileged runner user)
        run: bash scripts/lib/compose.test.sh
      - name: Shell scripts parse and pass shellcheck (operator scripts, compose stack, chart hooks)
        run: |
          set -e
          files=$(ls scripts/*.sh scripts/lib/*.sh deploy/compose/*.sh deploy/compose/*/*.sh deploy/helm/secops-cell/files/*.sh)
          for f in $files; do bash -n "$f"; done
          shellcheck --version | head -2
          shellcheck -S warning $files
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter matelot-cli
      - run: pnpm --filter matelot-cli build
      - name: Keycloak realm sync (http → https upgrade applied through the admin API; users untouched; idempotent)
        run: node deploy/helm/secops-cell/files/realm-sync.test.js
      - name: smoke.sh resolves a multi-word MATELOT_CLI (--check runs no Docker; exit 127 here was the compose job's failure)
        run: MATELOT_CLI="node ../../apps/cli/dist/index.js" bash deploy/compose/smoke.sh --check

  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: python3 -c 'import yaml' 2>/dev/null || pip install pyyaml
      - name: helm lint + render in every supported configuration
        run: bash scripts/chart-test.sh
      - name: kind cluster for API-server validation (about 40 s)
        uses: helm/kind-action@v1
        with: { cluster_name: chart-dry-run, wait: 60s }
      - name: Rendered chart passes `kubectl apply --dry-run=server` (what helm template cannot see - duplicate ConfigMap keys, schema errors)
        run: |
          kubectl create namespace tenant-acme
          for cfg in "" "--set ingress.tls=true" "--set tenant.name=Globex --set keycloak.theme.logo=https://cdn.example.com/logo.png --set keycloak.theme.primaryColor=#0f766e" "--set backup.enabled=true"; do
            # shellcheck disable=SC2086
            helm template acme deploy/helm/secops-cell --namespace tenant-acme $cfg | kubectl apply --server-side --dry-run=server --field-manager=ci-check --namespace tenant-acme -f - > /dev/null || { echo "server-side validation failed for: ${cfg:-defaults}" >&2; exit 1; }
            echo "server dry-run ok: ${cfg:-defaults}"
          done
      - name: Login theme on a real Keycloak pod (the chart's theme volume + mount as kubelet projects it; about 90 s)
        run: bash scripts/chart-theme-kind-test.sh
      - name: Operator scripts parse
        run: for f in scripts/*.sh scripts/lib/*.sh deploy/helm/secops-cell/files/*.sh; do bash -n "$f"; done
      - run: python3 scripts/lib/cellwait_test.py

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with: { context: ., file: apps/api/Dockerfile, push: false, tags: secops-api:ci }
      - uses: docker/build-push-action@v7
        with: { context: ., file: apps/api/Dockerfile, target: worker, push: false, tags: secops-worker:ci }
      - uses: docker/build-push-action@v7
        with: { context: ., file: apps/web/Dockerfile, push: false, tags: secops-web:ci }
      - uses: docker/build-push-action@v7
        with: { context: apps/runner, file: apps/runner/Dockerfile, push: false, tags: secops-runner:ci }

  compose:
    # the Docker Compose quick start, end to end, with the images built from this commit (deploy/compose/smoke.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with: { context: ., file: apps/api/Dockerfile, target: runtime, load: true, tags: "secops/api:ci", cache-from: "type=gha,scope=api", cache-to: "type=gha,scope=api,mode=max" }
      - uses: docker/build-push-action@v7
        with: { context: ., file: apps/api/Dockerfile, target: worker, load: true, tags: "secops/worker:ci", cache-from: "type=gha,scope=api" }
      - uses: docker/build-push-action@v7
        with: { context: ., file: apps/web/Dockerfile, load: true, tags: "secops/web:ci", cache-from: "type=gha,scope=web", cache-to: "type=gha,scope=web,mode=max" }
      - uses: docker/build-push-action@v7
        with: { context: apps/runner, file: apps/runner/Dockerfile, load: true, tags: "secops/runner:ci", cache-from: "type=gha,scope=runner", cache-to: "type=gha,scope=runner,mode=max" }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter matelot-cli && pnpm --filter matelot-cli build
      - name: docker compose config renders with the example .env
        run: cd deploy/compose && docker compose --env-file .env.example config --quiet
      - name: nginx config of the web image is valid
        run: docker run --rm secops/web:ci nginx -t
      - name: Smoke test (up → doctor → project → backup → down -v → restore)
        working-directory: deploy/compose
        env:
          MATELOT_CLI: node ../../apps/cli/dist/index.js
          MATELOT_VERSION: ci            # smoke.sh writes these into its own .env.smoke (the user's .env is never used)
          MATELOT_REGISTRY_PREFIX: secops
        run: bash smoke.sh
      - name: Logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose ps; docker compose logs --tail 200
