{{- if .Values.ingress.enabled }}
# One host per cell: /api and /.well-known -> API, everything else -> the web app (or the API when web is disabled).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-app
  labels:
    {{- include "cell.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ include "cell.apiHost" . | quote }}]
      secretName: {{ .Release.Name }}-app-tls
  {{- end }}
  rules:
    - host: {{ include "cell.apiHost" . | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  name: http
          # OAuth / OIDC discovery of the API (matelot login, MCP clients); without this the web app's index.html answers
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-{{ ternary "web" "api" .Values.web.enabled }}
                port:
                  name: http
{{- end }}
