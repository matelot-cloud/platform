name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: platform, POSTGRES_PASSWORD: platform, POSTGRES_DB: platform }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @secops/api typecheck
      - run: pnpm --filter @secops/api test
      - run: pnpm --filter @secops/api build
      - name: Migrations apply on a fresh database
        run: node apps/api/dist/migrate.js
        env: { DATABASE_URL: "postgresql://platform:platform@localhost:5432/platform" }
      - name: Schema, migrations and snapshot are in sync (drizzle-kit generate must be a no-op)
        run: |
          pnpm --filter @secops/api db:generate
          if [ -n "$(git status --porcelain apps/api/drizzle)" ]; then
            echo "::error::drizzle-kit generate produced changes: the schema differs from the last snapshot. Every schema change ships its migration SQL and the regenerated snapshot in the same commit (CLAUDE.md § Working on the schema)."
            git status --porcelain apps/api/drizzle; exit 1
          fi

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @secops/web build
      - run: pnpm --filter @secops/runner build
      - run: pnpm --filter secops-platform-cli build && pnpm --filter secops-platform-cli test
      - run: pnpm --filter @secops/web test
      - name: Documentation renders and every link resolves
        run: node tools/docs-site/test.mjs && node tools/docs-site/build.mjs --check

  layout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Only the monorepo's top-level directories exist (stale copies from old drops fail here)
        run: bash scripts/check-layout.sh

  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: python3 -c 'import yaml' 2>/dev/null || pip install pyyaml
      - name: helm lint + render in every supported configuration
        run: bash scripts/chart-test.sh
      - name: Operator scripts parse
        run: for f in scripts/*.sh scripts/lib/*.sh deploy/helm/secops-cell/files/*.sh; do bash -n "$f"; done
      - run: python3 scripts/lib/cellwait_test.py

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with: { context: ., file: apps/api/Dockerfile, push: false, tags: secops-api:ci }
      - uses: docker/build-push-action@v7
        with: { context: ., file: apps/api/Dockerfile, target: worker, push: false, tags: secops-worker:ci }
      - uses: docker/build-push-action@v7
        with: { context: ., file: apps/web/Dockerfile, push: false, tags: secops-web:ci }
      - uses: docker/build-push-action@v7
        with: { context: apps/runner, file: apps/runner/Dockerfile, push: false, tags: secops-runner:ci }
