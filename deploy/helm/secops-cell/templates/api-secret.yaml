apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-api-secrets
  labels:
    {{- include "cell.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "cell.databaseUrl" . | quote }}
  REDIS_URL: {{ include "cell.redisUrl" . | quote }}
  GITHUB_APP_PRIVATE_KEY_BASE64: {{ .Values.github.privateKeyBase64 | quote }}
  GITHUB_APP_WEBHOOK_SECRET: {{ .Values.github.webhookSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-cell-key
  labels:
    {{- include "cell.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  CELL_ENCRYPTION_KEY: {{ include "cell.encryptionKey" . | quote }}
{{- if .Values.observability.otlp.headers }}
---
# OTLP headers (a Grafana Cloud token, say): a Secret, referenced by every traced component
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-otel
  labels:
    {{- include "cell.labels" . | nindent 4 }}
type: Opaque
stringData:
  OTEL_EXPORTER_OTLP_HEADERS: {{ $pairs := list }}{{ range $k, $v := .Values.observability.otlp.headers }}{{ $pairs = append $pairs (printf "%s=%s" $k $v) }}{{ end }}{{ join "," $pairs | quote }}
{{- end }}
